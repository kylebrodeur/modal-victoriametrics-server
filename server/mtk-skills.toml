# The lifecycle skills this package ships. mtk reads this manifest from the
# vendored copy; names compose as mtk-<pkg>-<stage>. applies = the lowest
# lifecycle link a skill needs (any | configured | deployed).
[[skill]]
name = "mtk-vm-init-config"
path = "skills/vm-init-config"
stage = "init-config"
applies = "any"
when = "adding the VM metrics store to a project, or writing its overlay"
summary = "Init, overlay, and first config for the metrics store."

[[skill]]
name = "mtk-vm-setup-hooks"
path = "skills/vm-setup-hooks"
stage = "setup-hooks"
applies = "any"
when = "wiring boot hooks or the metrics writer env in front of the VM"
summary = "Register hooks on the VM seam; wire writers."

[[skill]]
name = "mtk-vm-build-deploy"
path = "skills/vm-build-deploy"
stage = "build-deploy"
applies = "any"
when = "deploying or upgrading the VM instance (auth secret, volume, retention)"
summary = "Deploy and upgrade recipes for the metrics store."

[[skill]]
name = "mtk-vm-develop"
path = "skills/vm-develop"
stage = "develop"
applies = "deployed"
when = "querying or writing metrics against a running VM (write_metric, /api/v1/query)"
summary = "Day-2 work against a live VM: writers, queries, dashboards."