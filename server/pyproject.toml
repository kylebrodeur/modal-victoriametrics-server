[project]
name = "modal-victoriametrics-server"
version = "0.1.4"
description = "Single-node VictoriaMetrics on Modal: CPU-only, scale-to-zero, every endpoint Basic-Auth-gated by the binary itself"
requires-python = ">=3.11,<3.13"
dependencies = [
    "modal>=0.64,<2",
    "httpx>=0.27,<1",
]
license = "Apache-2.0"
authors = [{ name = "kylebrodeur" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# the vendored shared seam is canonical (its contains-errors are family-tested)
"server/libs/hooks.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]