name: Publish

# Publishes the server/ package to PyPI via trusted publishing (OIDC): no
# API token stored in GitHub. Runs when a release is published; re-runs
# upload only files PyPI does not yet have (skip-existing).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Build sdist and wheel
        run: uv build --project server
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: server/dist/
      # upload-artifact already moves paths; keep dist at server/dist for
      # the download step below.

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
